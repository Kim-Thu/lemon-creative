<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body{font:12px Inter,system-ui,sans-serif;margin:0;padding:16px}
textarea{width:100%;height:280px;box-sizing:border-box;font:11px/1.4 ui-monospace,monospace;padding:10px}
button{width:100%;padding:10px;margin-top:10px;border:0;border-radius:8px;background:#18a0fb;color:#fff;font-weight:700}
p{color:#666;line-height:1.5}
</style>
</head>
<body>
  <p>Dán JSON được export từ Chrome DevTools vào đây. Plugin sẽ dựng lại hierarchy và tạo Auto Layout cho flex/grid.</p>
  <textarea id="json" placeholder="Dán JSON ở đây..."></textarea>
  <button id="go">Import vào Figma</button>
  <script>
    document.getElementById("go").onclick = () => {
      const raw = document.getElementById("json").value.trim();
      if (!raw) return;
      parent.postMessage({ pluginMessage: { type: "import", raw } }, "*");
    };
  </script>
</body>
</html>
