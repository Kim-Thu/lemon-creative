<!doctype html><html><head><meta charset="utf-8"><title>Lemon responsive example</title><style>
:root{--brand:#735467;--space:24px;--radius:12px}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial;background:#faf8f4;color:#252321}main{max-width:1120px;margin:auto;padding:32px;display:flex;flex-direction:column;gap:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1,h2,p{margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{display:flex;flex-direction:column;gap:12px;padding:24px;background:#fff;border-radius:var(--radius)}button{font:inherit;border:0;padding:12px 24px;background:var(--brand);color:white;border-radius:8px}.card p{max-width:280px}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){main{padding:20px}header{flex-direction:column;align-items:flex-start}.cards{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Lemon Creative</h1><button data-figma-component="Button / Primary">Liên hệ</button></header><section class="cards"><article class="card" data-figma-component="Card"><h2>Thiết kế</h2><p>Giữ nội dung chữ và cấu trúc chỉnh sửa được trong Figma.</p><button data-figma-component="Button / Primary">Liên hệ</button></article><article class="card" data-figma-component="Card"><h2>Lập trình</h2><p>Auto Layout giúp các phần tử co giãn theo khung.</p></article><article class="card" data-figma-component="Card"><h2>Hệ thống</h2><p>Màu và khoảng cách được gắn token.</p></article></section></main></body></html>
